apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mypolicy
  
spec:
  podSelector:
    matchExpressions:
      - key: statefulset.kubernetes.io/pod-name
        operator: In
        values: ["mystatefulset-0", "mystatefulset-1"]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: statefulset.kubernetes.io/pod-name
                operator: In
                values: ["mystatefulset-0", "mystatefulset-1"]
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: statefulset.kubernetes.io/pod-name
                operator: In
                values: ["mystatefulset-0", "mystatefulset-1"]
      ports:
        - protocol: TCP
          port: 80